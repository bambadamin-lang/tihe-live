name: tihe_player
description: TIHE Live — protected course library for Windows, Android and iOS.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State and routing.
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Networking. Dio for interceptors — token refresh and cert pinning both need them.
  dio: ^5.7.0

  # Secrets on device. Tokens only: content keys never reach Dart, they live in secure-core.
  flutter_secure_storage: ^9.2.2

  # Persian UI.
  shamsi_date: ^1.1.0

  # Video. Two engines behind one abstraction, per docs/adr/0001:
  #   media_kit (libmpv) on Windows, where the first-party plugin is weak;
  #   video_player (ExoPlayer) on Android/iOS, where it is the best option.
  # Both receive plaintext HLS from the loopback server, so they get identical input.
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5
  video_player: ^2.9.2

  # Device identity signals feeding the fingerprint (see secure-core::device).
  device_info_plus: ^11.2.0
  package_info_plus: ^8.1.2
  path_provider: ^2.1.5

  # FFI to secure-core.
  ffi: ^2.1.3

  crypto: ^3.0.6
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/

  fonts:
    # Vazirmatn: the de facto standard Persian UI font, and it carries Latin glyphs too, so mixed
    # course titles do not fall back to a different face mid-line.
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
