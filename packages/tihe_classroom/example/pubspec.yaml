name: tihe_classroom_example
description: Runs the TIHE Live classroom on its own — offline with a demo class, or against services/live.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  crypto: ^3.0.0
  flutter:
    sdk: flutter
  flutter_displaymode: ^0.7.0
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  tihe_classroom:
    path: ../

dev_dependencies:
  fake_async: ^1.3.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
