name: tihe_classroom_example
description: Runs the TIHE Live classroom on its own — offline with a demo class, or against services/live.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  tihe_classroom:
    path: ../

dev_dependencies:
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  # Profile-mode performance runs: integration_test/perf_test.dart.
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
