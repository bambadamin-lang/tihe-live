name: capture_guard
description: Blocks and detects screen capture for TIHE Live on Windows, macOS, Android and iOS.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  fake_async: ^1.3.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: ir.tihe.capture_guard
        pluginClass: CaptureGuardPlugin
      ios:
        pluginClass: CaptureGuardPlugin
      macos:
        pluginClass: CaptureGuardPlugin
      windows:
        pluginClass: CaptureGuardPluginCApi
