# LiveKit Egress development configuration.
#
# Writes room composite recordings into the tihe-raw bucket, which is where
# services/ingest-worker picks them up. Layout is specified in docs/06-recording-pipeline.md.

api_key: devkey
api_secret: devsecret_change_me_in_production_00000000
ws_url: ws://livekit:7880

redis:
  address: redis:6379

# MinIO is S3-compatible; force_path_style is required for it.
s3:
  access_key: tihe_minio
  secret: tihe_minio_dev_password
  region: us-east-1
  endpoint: http://minio:9000
  bucket: tihe-raw
  force_path_style: true

# Room composites are rendered by services/live's own template (services/live/egress-template),
# passed per request as customBaseUrl — see docs/11-live-classroom.md §10.

# Roughly one Chrome instance per recorded room, so raise this only with CPU to match.
cpu_cost:
  room_composite_cpu_cost: 3.0

logging:
  level: info
