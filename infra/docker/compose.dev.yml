# Development stack for TIHE Live.
#
#   docker compose -f infra/docker/compose.dev.yml up -d
#
# LiveKit and Egress are in the "live" profile so the video-management developer does not
# have to run them:
#
#   docker compose -f infra/docker/compose.dev.yml --profile live up -d

name: tihe-live

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tihe
      POSTGRES_PASSWORD: tihe_dev_password
      POSTGRES_DB: tihe
      # Persian text sorts correctly with ICU; the C collation would order it wrongly.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale-provider=icu --icu-locale=fa-IR'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tihe -d tihe']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tihe_minio
      MINIO_ROOT_PASSWORD: tihe_minio_dev_password
      # Presigned URLs must be signed for the hostname the client actually uses.
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: create the buckets the pipeline expects and lock them down.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    volumes:
      - ../scripts/minio-init.sh:/init.sh:ro
    command: /init.sh
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: tihe_minio
      MINIO_ROOT_PASSWORD: tihe_minio_dev_password
    restart: 'no'

  # ---------------------------------------------------------------------------
  # Live classroom — profile "live", owned by the live-classroom developer.
  # ---------------------------------------------------------------------------

  livekit:
    image: livekit/livekit-server:latest
    profiles: ['live']
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    ports:
      - '7880:7880' # HTTP / WebSocket signalling
      - '7881:7881' # TCP fallback for WebRTC
      - '50000-50100:50000-50100/udp' # RTC media
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    depends_on:
      redis:
        condition: service_healthy

  livekit-egress:
    image: livekit/egress:latest
    profiles: ['live']
    restart: unless-stopped
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./egress.yaml:/etc/egress.yaml:ro
    # Egress renders the room composite in headless Chrome, which needs a larger
    # shared-memory segment than the Docker default of 64 MB or it will crash mid-recording.
    shm_size: '1gb'
    cap_add:
      - SYS_ADMIN
    depends_on:
      - livekit
      - redis

volumes:
  postgres_data:
  redis_data:
  minio_data:
