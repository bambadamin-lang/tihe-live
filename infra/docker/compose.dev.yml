# Development stack for TIHE Live.
#
#   docker compose -f infra/docker/compose.dev.yml up -d
#
# LiveKit and Egress are in the "live" profile so the video-management developer does not
# have to run them:
#
#   docker compose -f infra/docker/compose.dev.yml --profile live up -d

name: tihe-live

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tihe
      POSTGRES_PASSWORD: tihe_dev_password
      POSTGRES_DB: tihe
      # Persian text sorts correctly with ICU; the C collation would order it wrongly.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale-provider=icu --icu-locale=fa-IR'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tihe -d tihe']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # S3-compatible object storage. MinIO stopped publishing images, so this is RustFS, which speaks
  # the same API; nothing in the code names the vendor (ADR-0004).
  storage:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: tihe_minio
      RUSTFS_SECRET_KEY: tihe_minio_dev_password
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # web console
    volumes:
      - storage_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/health']
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: create the buckets the pipeline expects and lock them down. Uses the storage image
  # only for its curl, which signs plain S3 requests.
  storage-init:
    image: rustfs/rustfs:latest
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: /bin/sh
    volumes:
      - ../scripts/storage-init.sh:/init.sh:ro
    command: /init.sh
    environment:
      S3_ENDPOINT: http://storage:9000
      S3_ACCESS_KEY: tihe_minio
      S3_SECRET_KEY: tihe_minio_dev_password
    restart: 'no'

  # ---------------------------------------------------------------------------
  # Live classroom — profile "live", owned by the live-classroom developer.
  # ---------------------------------------------------------------------------

  livekit:
    image: livekit/livekit-server:latest
    profiles: ['live']
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    ports:
      - '7880:7880' # HTTP / WebSocket signalling
      - '7881:7881' # TCP fallback for WebRTC
      - '50000-50100:50000-50100/udp' # RTC media
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    # Webhooks go to services/api and services/live running on the host. Docker Desktop
    # resolves host.docker.internal by itself; Linux needs this mapping.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      redis:
        condition: service_healthy

  livekit-egress:
    image: livekit/egress:latest
    profiles: ['live']
    restart: unless-stopped
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./egress.yaml:/etc/egress.yaml:ro
    # Egress renders the room composite in headless Chrome, which needs a larger
    # shared-memory segment than the Docker default of 64 MB or it will crash mid-recording.
    shm_size: '1gb'
    cap_add:
      - SYS_ADMIN
    # Egress's Chrome loads the recording template and the classroom gateway from
    # services/live on the host (:3100).
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      - livekit
      - redis

volumes:
  postgres_data:
  redis_data:
  storage_data:
