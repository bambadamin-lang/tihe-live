name: Windows installer

# Builds the classroom app for Windows and wraps it in the Persian setup wizard
# (packages/tihe_classroom/example/installer/windows). The Setup.exe is attached to the run as
# an artifact. Every merge to main, and every live-v* tag, also publishes it as a GitHub
# release with tihe-live-update.json beside it: installed apps read that file from the latest
# release and update themselves (example/lib/updater.dart). The repository must be public for
# them to reach it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 0.2.0'
        required: false
  push:
    branches: [main]
    tags: ['live-v*']
    paths:
      - 'packages/tihe_classroom/**'
      - 'packages/capture_guard/**'
      - '.github/workflows/windows-installer.yml'
  pull_request:
    paths:
      - 'packages/tihe_classroom/**'
      - 'packages/capture_guard/**'
      - '.github/workflows/windows-installer.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a pull request makes the older build moot; a build of main is a release,
  # and one cut off half-published would leave the latest release without its update file.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  installer:
    name: Build TIHE Live Setup.exe
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history for a tag's build, to check it against main (below). The falsy 0 goes
          # last: in the middle of && || it would fall through to the other value.
          fetch-depth: ${{ github.ref_type != 'tag' && 1 || 0 }}

      # Releases are what students install, so they come from main only: a tag on a branch that
      # missed main's work (the design, CLAUDE.md rule 11) would ship an older app under a newer
      # number. Pull-request builds are checked out merged with main already.
      - name: Release only what is on main
        if: github.ref_type == 'tag'
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor $env:GITHUB_SHA FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "${{ github.ref_name }} is not on main; tag a commit on main." }

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      # A tag names its version. Anything else is the example's major.minor (pubspec.yaml) and
      # this workflow's run number, which only grows, so every build of main is newer than the
      # one before and installed apps take it. Bump pubspec's minor before tagging by hand, so a
      # tag never sorts below the builds of main already out.
      - name: Pick the version
        run: |
          $v = '${{ github.event.inputs.version }}'
          if (-not $v -and '${{ github.ref_type }}' -eq 'tag') { $v = '${{ github.ref_name }}' -replace '^live-v', '' }
          if (-not $v) {
            $m = Select-String -Path packages/tihe_classroom/example/pubspec.yaml -Pattern '^version:\s*(\d+)\.(\d+)'
            if (-not $m) { throw 'no version in packages/tihe_classroom/example/pubspec.yaml' }
            $g = $m.Matches[0].Groups
            $v = "$($g[1].Value).$($g[2].Value).${{ github.run_number }}"
          }
          if ($v -notmatch '^\d+(\.\d+){1,3}$') { throw "not a version: $v" }
          "APP_VERSION=$v" >> $env:GITHUB_ENV

      - name: Build the Windows app
        working-directory: packages/tihe_classroom/example
        # The version is also compiled in for the self-updater; a build without it (flutter run,
        # a local build) never updates itself.
        run: >
          flutter build windows --release --build-name $env:APP_VERSION
          --dart-define=TIHE_APP_VERSION=$env:APP_VERSION

      # Copies in the Visual C++ runtime DLLs the app imports (app-local, which Microsoft
      # permits), then fails if anything loaded at start-up is neither bundled nor part of
      # Windows, so Setup.exe never needs a separate runtime install.
      - name: Bundle the Visual C++ runtime and check dependencies
        run: >
          ./packages/tihe_classroom/example/installer/windows/check-dependencies.ps1
          -Bundle packages/tihe_classroom/example/build/windows/x64/runner/Release
          -BundleVcRuntime

      - name: Fetch the Persian wizard text
        continue-on-error: true
        run: >
          Invoke-WebRequest -OutFile packages/tihe_classroom/example/installer/windows/Farsi.isl
          https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/Farsi.isl

      - name: Install Inno Setup
        run: choco upgrade innosetup -y --no-progress

      - name: Build the setup wizard
        run: >
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          "/DAppVersion=$env:APP_VERSION"
          "/DDefaultServer=${{ vars.TIHE_LIVE_URL || 'http://localhost:3100/v1/live' }}"
          packages/tihe_classroom/example/installer/windows/tihe_live.iss

      - uses: actions/upload-artifact@v4
        with:
          name: TIHE-Live-Setup-${{ env.APP_VERSION }}
          path: packages/tihe_classroom/example/installer/windows/Output/*.exe
          if-no-files-found: error

      # What installed apps read to update themselves: the version, where the wizard is, and its
      # SHA-256, which the app checks before running it.
      - name: Write the update file
        if: github.ref_type == 'tag' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          $exe = Get-Item packages/tihe_classroom/example/installer/windows/Output/*.exe
          $tag = "live-v$env:APP_VERSION"
          [ordered]@{
            version = $env:APP_VERSION
            url = "https://github.com/${{ github.repository }}/releases/download/$tag/$($exe.Name)"
            sha256 = (Get-FileHash -Algorithm SHA256 $exe.FullName).Hash.ToLowerInvariant()
          } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM packages/tihe_classroom/example/installer/windows/Output/tihe-live-update.json
          Get-Content packages/tihe_classroom/example/installer/windows/Output/tihe-live-update.json

      - name: Publish the release
        if: github.ref_type == 'tag' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "live-v$env:APP_VERSION"
          $assets = (Get-ChildItem packages/tihe_classroom/example/installer/windows/Output/*.exe, packages/tihe_classroom/example/installer/windows/Output/tihe-live-update.json).FullName
          gh release create $tag --target $env:GITHUB_SHA --latest --title "TIHE Live $env:APP_VERSION" `
            --notes "Windows setup wizard for TIHE Live. Installed apps update to this release on their own." `
            @assets
          if ($LASTEXITCODE -ne 0) { throw 'publishing the release failed' }
