name: Windows installer

# Builds the classroom app for Windows and wraps it in the Persian setup wizard
# (packages/tihe_classroom/example/installer/windows). The Setup.exe is attached to the run as
# an artifact; tags also publish it as a GitHub release, here and in the public releases repo
# that installed apps check for updates (example/lib/update.dart).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 0.2.0'
        required: false
  push:
    tags: ['live-v*']
  pull_request:
    paths:
      - 'packages/tihe_classroom/**'
      - 'packages/capture_guard/**'
      - '.github/workflows/windows-installer.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: Build TIHE Live Setup.exe
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      # Public and code-free, so the app reads it without a token. Create it with a README
      # (a release needs a commit to tag) and give a RELEASES_TOKEN secret write access to it.
      UPDATE_REPO: ${{ vars.TIHE_UPDATE_REPO || 'bambadamin-lang/tihe-live-releases' }}
      OUTPUT_DIR: packages/tihe_classroom/example/installer/windows/Output
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Pick the version
        run: |
          $v = '${{ github.event.inputs.version }}'
          if (-not $v -and '${{ github.ref_type }}' -eq 'tag') { $v = '${{ github.ref_name }}' -replace '^live-v', '' }
          if (-not $v) { $v = '0.1.${{ github.run_number }}' }
          # The updater only understands major.minor.patch.
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Version '$v' must look like 0.2.0" }
          "APP_VERSION=$v" >> $env:GITHUB_ENV

      - name: Build the Windows app
        working-directory: packages/tihe_classroom/example
        # The two defines switch the updater on; builds without them never update.
        run: >
          flutter build windows --release --build-name $env:APP_VERSION
          --dart-define=TIHE_APP_VERSION=$env:APP_VERSION
          --dart-define=TIHE_UPDATE_REPO=$env:UPDATE_REPO

      # Copies in the Visual C++ runtime DLLs the app imports (app-local, which Microsoft
      # permits), then fails if anything loaded at start-up is neither bundled nor part of
      # Windows, so Setup.exe never needs a separate runtime install.
      - name: Bundle the Visual C++ runtime and check dependencies
        run: >
          ./packages/tihe_classroom/example/installer/windows/check-dependencies.ps1
          -Bundle packages/tihe_classroom/example/build/windows/x64/runner/Release
          -BundleVcRuntime

      - name: Fetch the Persian wizard text
        continue-on-error: true
        run: >
          Invoke-WebRequest -OutFile packages/tihe_classroom/example/installer/windows/Farsi.isl
          https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/Farsi.isl

      - name: Install Inno Setup
        run: choco upgrade innosetup -y --no-progress

      - name: Build the setup wizard
        run: >
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          "/DAppVersion=$env:APP_VERSION"
          "/DDefaultServer=${{ vars.TIHE_LIVE_URL || 'http://localhost:3100/v1/live' }}"
          packages/tihe_classroom/example/installer/windows/tihe_live.iss

      # What the app reads to find, size and verify the new wizard (ReleaseManifest).
      - name: Write the update manifest
        run: |
          $exe = @(Get-ChildItem "$env:OUTPUT_DIR/*.exe")
          if ($exe.Count -ne 1) { throw "Expected one setup wizard, found $($exe.Count)" }
          [ordered]@{
            version = $env:APP_VERSION
            windows = [ordered]@{
              file   = $exe[0].Name
              sha256 = (Get-FileHash $exe[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              size   = $exe[0].Length
            }
          } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM "$env:OUTPUT_DIR/latest.json"
          Get-Content "$env:OUTPUT_DIR/latest.json"

      - uses: actions/upload-artifact@v4
        with:
          name: TIHE-Live-Setup-${{ env.APP_VERSION }}
          path: |
            ${{ env.OUTPUT_DIR }}/*.exe
            ${{ env.OUTPUT_DIR }}/latest.json
          if-no-files-found: error

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create '${{ github.ref_name }}' --title "TIHE Live $env:APP_VERSION"
          --notes 'Windows setup wizard for TIHE Live.'
          (Get-ChildItem "$env:OUTPUT_DIR/*.exe").FullName

      # Installed apps see the new version once this release is the public repo's latest.
      - name: Publish the update
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) {
            "::warning::RELEASES_TOKEN is not set, so installed apps will not be offered $env:APP_VERSION."
            exit 0
          }
          gh release create '${{ github.ref_name }}' --repo $env:UPDATE_REPO --latest `
            --title "TIHE Live $env:APP_VERSION" --notes 'Windows setup wizard for TIHE Live.' `
            (Get-ChildItem "$env:OUTPUT_DIR/*.exe").FullName "$env:OUTPUT_DIR/latest.json"
