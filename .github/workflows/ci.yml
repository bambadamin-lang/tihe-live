name: CI

on:
  push:
    branches: [main, 'claude/**', 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node (lint · typecheck · test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tihe
          POSTGRES_PASSWORD: tihe
          POSTGRES_DB: tihe_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
      minio:
        image: minio/minio:edge-cicd
        env:
          MINIO_ROOT_USER: tihe_minio
          MINIO_ROOT_PASSWORD: tihe_minio_dev_password
        ports: ['9000:9000']
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://tihe:tihe@localhost:5432/tihe_test
      REDIS_URL: redis://localhost:6379
      # services/live integration tests: its own database (ADR-0012) and Redis.
      LIVE_TEST_DATABASE_URL: postgresql://tihe:tihe@localhost:5432/tihe_live_test
      LIVE_TEST_REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: tihe_minio
      S3_SECRET_KEY: tihe_minio_dev_password
      S3_BUCKET_RAW: tihe-raw
      S3_BUCKET_VOD: tihe-vod
    steps:
      - uses: actions/checkout@v4

      # The version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Create storage buckets
        run: |
          curl -sSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc
          chmod +x /usr/local/bin/mc
          mc alias set ci http://localhost:9000 tihe_minio tihe_minio_dev_password
          mc mb --ignore-existing ci/tihe-raw ci/tihe-vod

      - name: Create the services/live test database
        run: PGPASSWORD=tihe psql -h localhost -U tihe -d tihe_test -c 'CREATE DATABASE tihe_live_test'

      - name: Generate Prisma clients
        run: |
          pnpm --filter @tihe/db generate
          pnpm --filter @tihe/live prisma:generate

      - name: Apply migrations
        # The packager and API tests write real rows, so the schema has to exist before they run.
        run: pnpm --filter @tihe/db migrate

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  rust:
    name: Rust (secure-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The crate arrives with the protection-core work; until then there is nothing to check.
      - uses: dtolnay/rust-toolchain@stable
        if: hashFiles('packages/secure-core/Cargo.toml') != ''
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        if: hashFiles('packages/secure-core/Cargo.toml') != ''
        with:
          workspaces: packages/secure-core

      - name: Format
        if: hashFiles('packages/secure-core/Cargo.toml') != ''
        run: cargo fmt --manifest-path packages/secure-core/Cargo.toml --check

      - name: Clippy
        if: hashFiles('packages/secure-core/Cargo.toml') != ''
        run: cargo clippy --manifest-path packages/secure-core/Cargo.toml --all-targets -- -D warnings

      - name: Test
        if: hashFiles('packages/secure-core/Cargo.toml') != ''
        run: cargo test --manifest-path packages/secure-core/Cargo.toml

  flutter:
    name: Flutter (format · analyze · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # livekit_client 2.x needs Flutter >= 3.38 (ADR-0009).
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      # Every Flutter package and app in the repo, found by its pubspec, so a new package is
      # covered without editing this file. example/ apps are analysed with their package and
      # their own tests run too.
      - name: Format, analyze and test each Flutter project
        run: |
          set -euo pipefail
          roots=()
          for d in apps packages; do if [ -d "$d" ]; then roots+=("$d"); fi; done
          mapfile -t projects < <(find "${roots[@]}" -name pubspec.yaml -not -path '*/example/*' \
            -not -path '*/.dart_tool/*' -not -path '*/build/*' -printf '%h\n' | sort)
          for dir in "${projects[@]}"; do
            echo "::group::$dir"
            (cd "$dir" && flutter pub get)
            if [ -d "$dir/example" ]; then (cd "$dir/example" && flutter pub get); fi
            dart format --output=none --set-exit-if-changed "$dir"
            (cd "$dir" && flutter analyze --no-fatal-infos)
            if [ -d "$dir/test" ]; then (cd "$dir" && flutter test); fi
            if [ -d "$dir/example/test" ]; then (cd "$dir/example" && flutter test); fi
            echo "::endgroup::"
          done
